<script>
  // تهيئة Firebase Firestore
  const firebaseConfig = {
    apiKey: "AIzaSyBnHLsf3lPVrdFn7I55UwkydCEtQ0sdHmAi",
    authDomain: "gestion-de-stock-340b3.firebaseapp.com",
    projectId: "gestion-de-stock-340b3",
    storageBucket: "gestion-de-stock-340b3.firebasestorage.app",
    messagingSenderId: "127691147828",
    appId: "1:127691147828:web:0tecfd0e1276e6024ce401",
    measurementId: "G-GZS536M71L"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // متغير حالة الاتصال للتوافق مع واجهة المستخدم
  let appData = { Articles: [], Schools: [], Movements: [], Plans: [] };
  let isCloudConnected = true;

  // تهيئة جلب البيانات التلقائي من Firebase
  function initFirebaseSync() {
    updateSyncStatus('syncing', 'جاري الاتصال السحابي...');

    // 1. مزامنة المؤسسات (Schools)
    db.collection("schools").onSnapshot((snapshot) => {
      appData.Schools = [];
      snapshot.forEach((doc) => {
        appData.Schools.push({ id: doc.id, ...doc.data() });
      });
      renderSchools();
      updateSyncStatus('synced', 'متصل بالسحابة');
    }, (error) => {
      console.error("خطأ في مزامنة المؤسسات:", error);
      updateSyncStatus('error', 'خطأ في الاتصال السحابي');
    });

    // 2. مزامنة المواد (Articles)
    db.collection("articles").onSnapshot((snapshot) => {
      appData.Articles = [];
      snapshot.forEach((doc) => {
        appData.Articles.push({ id: doc.id, ...doc.data() });
      });
      renderArticles();
    });

    // 3. مزامنة الحركات والتوزيع (Movements)
    db.collection("movements").onSnapshot((snapshot) => {
      appData.Movements = [];
      snapshot.forEach((doc) => {
        appData.Movements.push({ id: doc.id, ...doc.data() });
      });
      renderMovements();
    });
  }

  function updateSyncStatus(status, text) {
    const dot = document.getElementById('sync-dot');
    const txt = document.getElementById('sync-text');
    if (!dot) return;
    if (status === 'synced') {
      dot.className = 'w-3 h-3 rounded-full bg-emerald-400 ring-2 ring-white/30';
      if (txt) txt.textContent = text || 'متصل';
    } else if (status === 'syncing') {
      dot.className = 'w-3 h-3 rounded-full bg-amber-300 ring-2 ring-white/30 animate-pulse';
      if (txt) txt.textContent = text || 'جاري التحميل...';
    } else {
      dot.className = 'w-3 h-3 rounded-full bg-rose-500 ring-2 ring-white/30';
      if (txt) txt.textContent = text || 'غير متصل';
    }
  }

  // إضافة مؤسسة جديدة مباشرة إلى Firestore
  async function saveSchoolToFirestore(schoolName) {
    if (!schoolName || !schoolName.trim()) {
      alert("الرجاء إدخال اسم المؤسسة التعليمية");
      return;
    }
    try {
      updateSyncStatus('syncing', 'جاري الحفظ...');
      await db.collection("schools").add({
        name: schoolName.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert("تمت إضافة المؤسسة بنجاح!");
      closeModal('school');
    } catch (error) {
      console.error("خطأ أثناء إضافة المؤسسة: ", error);
      alert("حدث خطأ أثناء الحفظ في قاعدة البيانات: " + error.message);
      updateSyncStatus('error', 'فشل الحفظ');
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    initFirebaseSync();
  });
</script>

/* ---- نمط التطبيقات ---- */

@media (max-width:767px){.sheet-in{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}}
@media (max-width:767px){
  input,select{font-size:16px!important}
  .rwrap{background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important}
  .rtable thead{display:none}
  .rtable,.rtable tbody,.rtable tfoot{display:block}
  .rtable tbody tr,.rtable tfoot tr{display:block;margin:.6rem 0;padding:.55rem .75rem;background:#fff;border-radius:1rem;box-shadow:0 1px 4px rgba(15,23,42,.1);border-width:0!important}
  .rtable td{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.35rem 0;text-align:end}
  .rtable td::before{content:attr(data-label);font-weight:700;font-size:.75rem;color:#64748b;text-align:start;flex-shrink:0}
  .rtable td:not([data-label])::before{content:none}
  .rtable td[colspan]{display:block;text-align:center}
  .rtable td.m-hide{display:none}
  .rtable td.m-title{display:block;text-align:start;font-size:1.05rem;padding-bottom:.45rem;margin-bottom:.15rem;border-bottom:1px solid #f1f5f9}
  .rtable td button{padding:.5rem .9rem;border-radius:.65rem;font-size:.8rem}
  .dark .rtable tbody tr,.dark .rtable tfoot tr{background:#1e293b}
  .dark .rtable td.m-title{border-color:#334155}
}

      <div class="min-w-0">
        <h1 class="hidden sm:block text-lg font-extrabold leading-tight truncate" data-t="appTitle">نظام تدبير المخزون والمستلزمات المدرسية</h1>
        <div id="page-title" class="sm:hidden text-lg font-extrabold leading-tight truncate"></div>
        <p class="hidden sm:block text-[11px] text-indigo-200" data-t="subTitle">الإدارة العمومية - وحدة التوزيع والمخازن</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button type="button" id="sync-status" onclick="initFirebaseSync()" class="flex items-center gap-1.5 text-xs bg-white/15 px-2.5 py-2 rounded-full"><span id="sync-dot" class="w-3 h-3 rounded-full bg-emerald-400 ring-2 ring-white/30"></span><span id="sync-text" class="hidden">متصل</span></button>
      <button type="button" id="theme-btn" onclick="toggleTheme()" title="الوضع الداكن / الفاتح" class="w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 grid place-items-center active:scale-95"></button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 pt-4 pb-28 md:py-6 flex-grow w-full">
  <section id="section-schools" class="space-y-6">
    <div class="bg-white p-5 rounded-xl shadow-sm border flex justify-between items-center flex-wrap gap-4">
      <h2 class="text-lg font-bold text-slate-700">المؤسسات التعليمية المستفيدة</h2>
      <button type="button" onclick="openSchoolModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">إضافة مؤسسة جديدة</button>
    </div>
    <div class="bg-white rounded-xl shadow-sm border overflow-x-auto rwrap">
      <table class="w-full text-start text-sm rtable">
        <thead class="bg-slate-100 text-slate-600 font-bold border-b">
          <tr><th class="p-3 w-16">ID</th><th class="p-3">اسم المؤسسة التعليمية</th></tr>
        </thead>
        <tbody id="schools-table-body" class="divide-y"></tbody>
      </table>
    </div>
  </section>
</main>

<!-- نافذة إضافة مؤسسة جديدة -->
<div id="modal-school" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="font-bold text-slate-800">إضافة مؤسسة جديدة</h3>
      <button type="button" onclick="closeModal('school')" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
    </div>
    <form onsubmit="event.preventDefault(); saveSchoolToFirestore(document.getElementById('school-name-input').value);">
      <div class="space-y-3">
        <label class="block text-xs font-bold text-slate-600">اسم المؤسسة التعليمية:</label>
        <input type="text" id="school-name-input" required placeholder="أدخل اسم المؤسسة" class="w-full p-3 border rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div class="flex justify-end gap-2 pt-4">
        <button type="button" onclick="closeModal('school')" class="px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 hover:bg-slate-200">إلغاء</button>
        <button type="submit" class="px-5 py-2 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white">حفظ سحابي 💾</button>
      </div>
    </form>
  </div>
</div>

<script>
  function openSchoolModal() {
    document.getElementById('modal-school').classList.remove('hidden');
  }
  function closeModal(id) {
    document.getElementById('modal-' + id).classList.add('hidden');
  }
  function renderSchools() {
    const tbody = document.getElementById('schools-table-body');
    if (!tbody) return;
    tbody.innerHTML = appData.Schools.map((school, index) => `
      <tr>
        <td class="p-3 font-bold text-slate-500">${index + 1}</td>
        <td class="p-3 font-bold text-slate-800">${school.name}</td>
      </tr>
    `).join('');
  }
</script>
</body>
</html>
